name: recovery-candidate

on:
  pull_request:
    paths:
      - internal/store/**
      - internal/git/**
      - internal/engine/**
      - internal/statemachine/**
      - internal/worktreecoord/**
      - internal/workflowprompt/**
      - internal/workflowruntime/**
      - internal/workflowworker/**
      - internal/daemon/**
      - internal/cli/**
      - internal/config/**
      - cmd/sf/compiled_first_use_matrix_test.go
      - docs/tutorials/first-ticket.md
      - .github/workflows/recovery-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-candidate:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Expose approved repository-test toolchain
        run: |
          set -eu
          setup_go=$(command -v go)
          sudo mkdir -p /usr/local/go/bin
          sudo ln -sfn "$setup_go" /usr/local/go/bin/go
      - name: Test reservation and restart regressions
        id: reservation
        continue-on-error: true
        run: go test -p 1 -count=1 ./internal/store -run 'Test(ProtectedBaseRefreshReservationPreservesCompletedCIRepairParent|PendingProtectedBaseRefreshReclaimsPreparedTupleAfterRestart)$' -v
      - name: Test bounded completed-Builder readmission
        id: admission
        continue-on-error: true
        run: go test -p 1 -count=1 ./internal/worktreecoord
      - name: Test bounded repair authority and retained file identity
        id: authority
        continue-on-error: true
        run: |
          failures=0
          check() { "$@" || failures=1; }
          check go test -p 1 -count=1 ./internal/statemachine ./internal/engine
          check go test -p 1 -count=1 ./internal/store -run 'Test(Postbuild|TransitionPostbuild)' -v
          check go test -p 1 -count=1 ./internal/git -run '^Test(Retained|ProtectedCheckpoint|PrivateCheckpointIndex)' -v
          exit "$failures"
      - name: Test proof consistency and actionable status
        id: behavior
        continue-on-error: true
        run: |
          failures=0
          check() { "$@" || failures=1; }
          check go test -p 1 -count=1 ./internal/workflowprompt ./internal/cli
          check go test -p 1 -count=1 ./internal/store -run '^TestAuthenticatePostbuildFailure' -v
          check go test -p 1 -count=1 ./internal/daemon -run 'Test(RecoveryView|PostbuildCommandFailure|Daemon.*Prepared)' -v
          check go test -p 1 -count=1 ./internal/workflowruntime -run '^TestPostbuildCommandError' -v
          check go test -p 1 -count=1 ./internal/workflowworker -run '^TestRealStoreCompletedBuilderPostbuildFailure' -v
          check go test -p 1 -count=1 ./internal/workflowworker -run 'Test(OptionalPostbuildRepair|WorkerPostbuildRepair|StopRejectedPostbuildAmendment|ResumePreparedPostbuild)' -v
          check go test -p 1 -count=1 ./internal/workflowruntime -run 'Test(SchedulerPostbuild|SchedulerPreparedPostbuild|SchedulerCompletedPostbuildRepair|SchedulerReplaysRejectedAmendment|RepositoryMaterializerPreparePostbuildRepair|RepositoryMaterializerPostbuildRepair|RepositoryMaterializerPostbuildAmendment|ProtectedAmendment)' -v
          check go test -p 1 -count=1 ./internal/localruntime -run '^TestPostbuildAmendmentDispatch' -v
          exit "$failures"
      - name: Check first-use compatibility and documented command order
        id: onboarding
        continue-on-error: true
        run: |
          scripts/docs-smoke
          go test -p 1 -count=1 ./cmd/sf -run '^TestCompiledDevFirstUseStackMatrixIsLocalAndHonest$' -v
      - name: Require every validation group
        if: always()
        env:
          VALIDATION: ${{ toJSON(steps) }}
        run: |
          jq -e '[.reservation.outcome, .admission.outcome, .authority.outcome, .behavior.outcome, .onboarding.outcome] | all(. == "success")' <<< "$VALIDATION"
      - name: Build exact native development candidate
        run: |
          set -eu
          candidate_sha=$(git rev-parse HEAD)
          uname -m
          make build-dev DEV_VERSION=0.1.0-dev.ci-recovery COMMIT="$candidate_sha" BIN_DIR=.context/recovery-candidate/bin
          .context/recovery-candidate/bin/sf-dev version --json
          tar -czf .context/recovery-candidate.tgz -C .context/recovery-candidate bin
      - uses: actions/upload-artifact@v4
        with:
          name: sf-recovery-candidate-${{ runner.arch }}
          path: .context/recovery-candidate.tgz
          if-no-files-found: error
          retention-days: 7
